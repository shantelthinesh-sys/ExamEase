{% extends "base.html" %}
{% block title %}Error {{ code }} - ExamEase{% endblock %}
{% block content %}
  <div class="card">
    <h2>{{ code }} - {{ "Access denied" if code == 403 else "Not found" }}</h2>
    <p>{{ message }}</p>
    <p><a class="btn" href="{{ url_for('index') }}">Go to home</a></p>
  </div>
{% endblock %}
